name: Deploy Game Server to Azure

on:
  push:
    branches: [master]
    paths:
      - 'backend/game-server/**'
      - '.github/workflows/deploy-game-server.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-game-server:
    name: Game Server — Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Game Server image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/game-server
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/game-server:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/game-server:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Game Server to Container Apps
        run: |
          az containerapp update \
            --name game-server \
            --resource-group Games \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/game-server:${{ github.sha }}
