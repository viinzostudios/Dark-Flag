name: Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-api:
    name: API — build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  test-game-server:
    name: Game Server — build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/game-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/game-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  test-frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
